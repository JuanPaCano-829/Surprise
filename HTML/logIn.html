<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Log In</title>
    <link rel="stylesheet" href="../CSS/logIn.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <section class="box" id="loginCard">
        <div class="frame frame-cyan"></div>
        <div class="frame frame-pink"></div>
        <div class="login">
          <div class="loginBx">
            <div class="swipe-container" id="swipeContainer">
              <div class="swipe-track" id="swipeTrack">
                <div class="swipe-handle" id="swipeHandle">
                  <span class="lock-icon">🔒</span>
                </div>
                <span class="swipe-text" id="swipeText"
                  >Desliza para abrir 💗</span
                >
              </div>
            </div>
            <form class="form-content" id="loginForm" novalidate>
              <div class="title-row">
                <h2>↪ LOGIN 💗</h2>
                <button
                  class="close-btn"
                  id="closeLoginBtn"
                  type="button"
                  aria-label="Cerrar login"
                >
                  ✕
                </button>
              </div>

              <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
              />
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
              />
              <button class="submit-btn" type="submit">Sign in</button>
              <div class="group">
                <a href="#" id="signUpLink">Sign up</a>
              </div>

              <p class="message" id="loginMessage"></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="../JavaScript/logIn.js"></script>
  </body>
</html>
